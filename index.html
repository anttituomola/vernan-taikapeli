<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VERNAN TAIKAPOLKU</title>
<script>
// Versioleima: nosta tätä, kun julkaiset uuden version, niin selain lataa
// kaikki tiedostot uudestaan eikä yhdistä vanhaa index.html:ää uusiin skripteihin.
var VT_VERSION = '2026-09-07b';
document.write('<link rel="stylesheet" href="css/game.css?v=' + VT_VERSION + '">');
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hubChrome">
  <h1>&#10024; VERNAN TAIKAPOLKU &#10024;</h1>
</div>
<button id="karttaBtn" aria-label="KARTTA">&#127968;</button>
<button id="seaBtn" aria-label="MERELLE">&#9973;</button>
<button id="replayBtn" aria-label="UUDESTAAN">&#8635;</button>
<button id="continueBtn" aria-label="JATKA">&#129412;</button>
<button id="jumpBtn" aria-label="HYPPAA">&#8593;</button>
<button id="penBtn" aria-label="KYNA">&#9999;</button>
<button id="muteBtn" aria-label="AANI">&#128266;</button>

<script>
// Saarirekisteri ensin: se rakentaa PHASES/HUB_WORLDS/ISLANDS-näkymät ja
// scriptManifest()-latauslistan. Skriptit ladataan järjestyksessä versioleimalla
// (document.write säilyttää järjestyksen).
document.write('<script src="js/worlds.js?v=' + VT_VERSION + '"><\/script>');
(function () {
  var files = scriptManifest();
  var i;
  for (i = 0; i < files.length; i++) {
    document.write('<script src="js/' + files[i] + '.js?v=' + VT_VERSION + '"><\/script>');
  }
})();
</script>
</body>
</html>
